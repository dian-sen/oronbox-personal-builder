name: Encrypted personal APK build
run-name: Relay ${{ github.event.client_payload.request_id }}
on:
  repository_dispatch:
    types: [build-oronbox-personal]

permissions: {}
concurrency:
  group: relay-${{ github.event.client_payload.request_id }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'dian-sen/oronbox-personal-builder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      FLUTTER_VERSION: '3.47.9'
      REQUIRE_SOURCE_ON_MAIN: ${{ vars.REQUIRE_SOURCE_ON_MAIN || 'true' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Set isolated temporary paths
        run: |
          printf 'RELAY_REQUEST=%s/oronbox-relay-request.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RELAY_OUTPUT=%s/oronbox-relay-output\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout public relay implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: relay
          persist-credentials: false
      - name: Validate exact dispatch schema and certificate
        id: request
        run: python3 relay/scripts/relay.py validate
      - name: Remove unneeded runner preinstalls
        run: bash relay/scripts/ci.sh clean
      - name: Checkout private source at exact requested SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dian-sen/OronBox
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.ORONBOX_SOURCE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify source SHA, ancestry, versions and public submodule
        run: python3 relay/scripts/relay.py verify-source --source source
      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Dart for pinned FVM
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b
        with:
          sdk: stable
      - name: Install pinned FVM, Flutter and locked dependencies
        working-directory: source
        run: bash ../relay/scripts/ci.sh install
      - name: Install Rust and Android targets
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Test normal and personal profiles
        working-directory: source
        run: bash ../relay/scripts/ci.sh test
      - name: Compile personal release APK as private signing input
        working-directory: source
        run: bash ../relay/scripts/ci.sh build
      - name: Encrypt signing input with one-time certificate
        run: python3 relay/scripts/relay.py encrypt --apk source/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload only CMS and minimal callback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relay-${{ steps.request.outputs.request_id }}
          path: |
            ${{ runner.temp }}/oronbox-relay-output/payload.cms
            ${{ runner.temp }}/oronbox-relay-output/callback.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove temporary request, certificate and APK
        if: always()
        run: |
          rm -f -- "$RELAY_REQUEST" source/build/app/outputs/flutter-apk/app-release.apk
          rm -rf -- "$RELAY_OUTPUT"
